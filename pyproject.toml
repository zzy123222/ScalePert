[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scalepert"
version = "1.0.0"
description = "ScalePert: interpretable local-manifold virtual perturbation for target prioritization from observational single-cell transcriptomes"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ScalePert Developers" }]
keywords = [
    "single-cell",
    "perturbation",
    "target-prioritization",
    "computational-biology",
    "scanpy",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "scikit-learn>=1.1",
    "anndata>=0.8",
    "scanpy>=1.9",
    "statsmodels>=0.13",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.6", "seaborn>=0.12"]
dev = ["pytest>=7", "matplotlib>=3.6", "seaborn>=0.12"]

[project.urls]
Homepage = "https://github.com/zzy123222/ScalePert"
Documentation = "https://github.com/zzy123222/ScalePert#readme"
Issues = "https://github.com/zzy123222/ScalePert/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"scalepert" = ["data_store/*.h5ad"]
